name: QuitSmokingDuration

options:
  bundleIdPrefix: com.laodan
  deploymentTarget:
    iOS: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  QuitSmokingDuration:
    type: application
    platform: iOS
    sources:
      - path: LaodanDemo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.laodan.quitsmokingduration
        PRODUCT_NAME: QuitSmokingDuration
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "戒烟时长"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Automatic


